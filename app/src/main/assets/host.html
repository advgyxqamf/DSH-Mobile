<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DSH Host</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; background: #0b0e14; }
    #kernel { display: block; width: 100%; height: 100%; border: 0; }
  </style>
  <script>
    // 宿主桥：内核 UI 以 iframe 形式嵌入；内核侧 kernelUpdateBridge.ts 向 parent postMessage。
    // 本宿主页把请求转交原生层（DshNative.onRequest），原生处理完再经 dshDeliverResult 回灌结果。
    window.addEventListener('message', function (e) {
      var d = e.data;
      if (!d || d.type !== 'dsh:kernel-update-request') return;
      if (window.DshNative && window.DshNative.onRequest) {
        window.DshNative.onRequest(JSON.stringify(d));
      }
    });

    // 由原生层（MainActivity）调用：把 dsh:kernel-update-result 投递回内核 iframe。
    function dshDeliverResult(json) {
      try {
        var msg = JSON.parse(json);
        var f = document.getElementById('kernel');
        if (f && f.contentWindow) f.contentWindow.postMessage(msg, '*');
      } catch (err) { /* 忽略解析错误 */ }
    }
  </script>
</head>
<body>
  <iframe id="kernel" src="http://127.0.0.1:3080/"></iframe>
</body>
</html>
