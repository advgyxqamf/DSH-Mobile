name: Build Android Node Container APK

# 这个工作流存在的意义：CI 运行器有完整的公网（能访问 dl.google.com），
# 而本仓库作者所在的沙箱环境外网被白名单限制、无法下载 Android SDK/NDK。
# 因此“出包”交给 GitHub Actions：一键编译出可安装的 debug APK 作为构件(artifact)下载。
#
# 用法：把本仓库推到 GitHub → Actions → 手动 Run workflow（或 push 到 main/master 自动触发）
#      → 完成后在 Artifacts 里下载 android-node-container-apk.zip，里面是 app-debug.apk。

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        # 该 action 会把 SDK 装到 $ANDROID_SDK_ROOT

      - name: Install SDK packages (platform-tools / platform / build-tools / NDK)
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses 2>&1 | tee -a /tmp/sdk-install.log
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018" 2>&1 | tee -a /tmp/sdk-install.log
          # 把实际装上的 NDK 版本透传给后续步骤（避免硬编码 build 号对不上 → 装失败）
          NDK_VER=$(ls "$ANDROID_SDK_ROOT/ndk" 2>/dev/null | sort -V | tail -1)
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/$NDK_VER" >> "$GITHUB_ENV"
          echo "Resolved NDK -> $NDK_VER"

      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 ninja cmake make zip

      - name: Resolve latest Node 24.x tag
        id: nodever
        run: |
          TAG=$(git ls-remote --tags https://github.com/nodejs/node \
            | grep -oE 'refs/tags/v24\.[0-9]+\.[0-9]+$' \
            | sed 's#refs/tags/v##' | sort -V | tail -1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved Node 24.x -> $TAG"

      - name: Sync node-versions.json default/bundled to resolved tag
        env:
          NODE_TAG: ${{ steps.nodever.outputs.tag }}
        run: |
          python3 - <<'PY'
          import json, os
          p = "app/src/main/assets/node-versions.json"
          tag = os.environ["NODE_TAG"]
          d = json.load(open(p))
          d["default"] = tag
          for v in d["versions"]:
              if v.get("bundled"):
                  v["version"] = tag
                  v["url"] = v["url"].replace("24.21.0", tag)
          json.dump(d, open(p, "w"), indent=2, ensure_ascii=False)
          print("node-versions.json default ->", tag)
          PY

      - name: Build Node for Android (NDK 交叉编译 arm64-v8a)
        env:
          ANDROID_NDK: ${{ env.ANDROID_NDK }}
          ANDROID_API: "24"
        run: ./scripts/build-node-android.sh ${{ steps.nodever.outputs.tag }} 2>&1 | tee /tmp/node-build.log

      - name: Set up Gradle
        uses: gradle/setup-gradle@v4

      - name: Build debug APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug 2>&1 | tee /tmp/gradle-build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-node-container-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ---------------------------------------------------------------------------
      # 失败自诊：沙箱侧无法直接访问 GitHub API/日志，故把报错汇总推到 ci-diag 分支，
      # 通过 raw.githubusercontent.com（git/raw 流量可穿透 ghproxy）让维护者能读取。
      # 仅在该 job 任一步骤失败时运行。
      # ---------------------------------------------------------------------------
      - name: Capture failure diagnostics -> ci-diag branch
        if: failure()
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          git config user.email "ci@workbuddy.local"
          git config user.name "CI Diagnostic Bot"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p diag
          {
            echo "=== CI failure diagnostics ==="
            echo "run : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "node: ${{ steps.nodever.outputs.tag }}"
            echo "ANDROID_SDK_ROOT: ${ANDROID_SDK_ROOT:-<unset>}"
            echo "ANDROID_NDK: ${ANDROID_NDK:-<unset>}"
            echo
            echo "=== sdk-install.log (tail 100) ==="
            tail -100 /tmp/sdk-install.log 2>/dev/null || echo "(no sdk-install.log)"
            echo
            echo "=== node-build.log (tail 150) ==="
            tail -150 /tmp/node-build.log 2>/dev/null || echo "(no node-build.log — failure occurred before Node build)"
            echo
            echo "=== gradle-build.log (tail 150) ==="
            tail -150 /tmp/gradle-build.log 2>/dev/null || echo "(no gradle-build.log — failure before Gradle)"
          } > diag/ci-failure-last.txt
          git add -A
          git commit -m "ci: automated failure diagnostics" || true
          # 用全权限 PAT 推送（GITHUB_TOKEN 在本仓库无 push 新分支权限，改用 secrets.PAT）
          git remote set-url origin "https://x-access-token:${PAT}@github.com/${{ github.repository }}.git"
          echo "--- pushing diagnostics to ci-diag ---"
          git push origin HEAD:ci-diag --force 2>&1 | tee /tmp/push.log || cat /tmp/push.log
      - name: Upload failure diagnostics artifact (backup)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diag-log
          path: diag/ci-failure-last.txt
          if-no-files-found: warn
