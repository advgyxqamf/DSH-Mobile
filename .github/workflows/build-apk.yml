name: Build Android Node Container APK

# 这个工作流存在的意义：CI 运行器有完整的公网（能访问 dl.google.com），
# 而本仓库作者所在的沙箱环境外网被白名单限制、无法下载 Android SDK/NDK。
# 因此“出包”交给 GitHub Actions：一键编译出可安装的 debug APK 作为构件(artifact)下载。
#
# 用法：把本仓库推到 GitHub → Actions → 手动 Run workflow（或 push 到 main/master 自动触发）
#      → 完成后在 Artifacts 里下载 android-node-container-apk.zip，里面是 app-debug.apk。
#
# 注：诊断日志经 PAT（仓库 Secret）推到 ci-diag 分支，维护者在沙箱侧经 raw 通道读取。

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    # 硬超时：Node/V8 交叉编译正常在 40-90 分钟内完成。给到 150 分钟足够富余，
    # 又能保证万一编译死锁（曾出现过 ping 之后 70 分钟零信号的情况）不会一路耗到
    # GitHub 默认的 360 分钟。注意：超时会导致 job 被 cancel，而 `if: failure()`
    # 对 cancel 不触发，所以超时路径由下面的 heartbeat 步骤负责留痕。
    timeout-minutes: 150
    # 发 Release 需要 contents:write；用 workflow 自带 GITHUB_TOKEN 即可，不依赖 PAT。
    permissions:
      contents: write
    steps:
      # ---------------------------------------------------------------------------
      # 心跳：把「CI 活着、当前在哪个阶段」持续推到 ci-hb 分支。
      #
      # 为什么需要：沙箱侧读不到 GitHub Actions 日志，只能靠分支自报。原先只有开头
      # 一个 ci-ping，之后直到结束都没有任何信号，于是「还在编译」和「已经卡死」
      # 在外部看起来完全一样 —— 曾经为此白等 70 分钟。
      #
      # 做法：起一个后台循环，每 45 秒把「第几跳 + 时间戳 + 当前阶段」推一次。
      # 阶段名由后续步骤通过 /tmp/ci-stage 文件更新（见 set-stage 步骤）。
      # 循环在 job 结束时由 trap 清理，不阻塞主流程。
      # ---------------------------------------------------------------------------
      - name: Start heartbeat updater
        id: hbstart
        run: |
          echo "boot" > /tmp/ci-stage
          cat > /tmp/heartbeat.sh <<'HB'
          #!/usr/bin/env bash
          # 后台心跳：独立进程，每 45s 推一次 ci-hb。失败静默重试，绝不干扰主构建。
          set +e
          export GIT_TERMINAL_PROMPT=0
          cd /tmp/hbrepo 2>/dev/null || exit 0
          n=0
          while [ -f /tmp/ci-keepalive ]; do
            n=$((n+1))
            stage="$(cat /tmp/ci-stage 2>/dev/null || echo unknown)"
            {
              echo "CI_HEARTBEAT"
              echo "beat : $n"
              echo "time : $(date -u)"
              echo "stage: $stage"
              echo "run  : $RUN_ID"
              echo "sha  : $SHA"
            } > hb.txt
            git add hb.txt >/dev/null 2>&1
            git commit -q -m "hb $n ($stage)" >/dev/null 2>&1
            git push -q origin HEAD:ci-hb --force >/dev/null 2>&1
            sleep 45
          done
          HB
          chmod +x /tmp/heartbeat.sh
          touch /tmp/ci-keepalive
          git config --global --add safe.directory '*'
          TOKEN_USE="${{ secrets.PAT }}"
          [ -z "$TOKEN_USE" ] && TOKEN_USE="${{ secrets.GITHUB_TOKEN }}"
          rm -rf /tmp/hbrepo && mkdir -p /tmp/hbrepo && cd /tmp/hbrepo
          git clone --quiet "https://x-access-token:${TOKEN_USE}@github.com/${{ github.repository }}.git" . || exit 0
          git config user.email "ci@workbuddy.local"
          git config user.name "CI Heartbeat"
          export TOKEN_USE REPO_SLUG="${{ github.repository }}" RUN_ID="${{ github.run_id }}" SHA="${{ github.sha }}"
          setsid nohup /tmp/heartbeat.sh >/dev/null 2>&1 < /dev/null &
          echo "heartbeat started (pid $!), pushes to ci-hb every 45s"

      # ---------------------------------------------------------------------------
      # 连通性探针：在第一时间把 run 信息推到 ci-ping 分支。
      # 目的：区分「CI 根本没启动」vs「CI 跑了但推送受阻」。
      # 优先用 PAT（全权限，一定能推）；PAT 未配置时退回 GITHUB_TOKEN。
      # 沙箱侧经 raw 通道即可读到，无需 API。
      # ---------------------------------------------------------------------------
      - name: Ping (push ci-ping branch to prove CI ran)
        id: ping
        env:
          PAT: ${{ secrets.PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "1/9 ping-ready" > /tmp/ci-stage
          git config --global --add safe.directory '*'
          rm -rf /tmp/ping && mkdir -p /tmp/ping && cd /tmp/ping
          TOKEN_USE="${PAT}"
          if [ -z "$TOKEN_USE" ]; then
            echo "::warning::secrets.PAT is empty; falling back to GITHUB_TOKEN"
            TOKEN_USE="${GH_TOKEN}"
          fi
          if ! git clone "https://x-access-token:${TOKEN_USE}@github.com/${{ github.repository }}.git" . ; then
            echo "::error::ci-ping: git clone failed (token=${TOKEN_USE:0:8}...)"
            exit 1
          fi
          {
            echo "CI_PING_OK"
            echo "time : $(date -u)"
            echo "run  : ${{ github.run_id }}"
            echo "sha  : ${{ github.sha }}"
            echo "token: $( [ -n "${PAT}" ] && echo PAT || echo GITHUB_TOKEN )"
          } > ping.txt
          git config user.email "ci@workbuddy.local"
          git config user.name "CI Probe"
          git add ping.txt
          git commit -m "ci: ping"
          if ! git push origin HEAD:ci-ping --force; then
            echo "::error::ci-ping: git push failed — token has no write access"
            exit 1
          fi
          echo "::notice::ci-ping pushed successfully"

      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        uses: actions/checkout@v4

      - name: Set up JDK 17
        id: setupjava
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 说明：ubuntu-latest runner 自带 Android SDK（$ANDROID_SDK_ROOT / $ANDROID_HOME 已设置）。
      # 不使用第三方 setup-android action，避免“action 仓库解析不到导致 Set up job 直接失败”。
      - name: Show Android SDK env
        id: sdkenv
        run: |
          echo "sdk-env" > /tmp/ci-stage
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          ls "$ANDROID_SDK_ROOT" 2>/dev/null || true

      - name: Install SDK packages (platform-tools / platform / build-tools; NDK reused if present)
        id: sdkinstall
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          echo "4/9 sdk-install" > /tmp/ci-stage
          set -o pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "== sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version 2>&1 | tee -a /tmp/sdk-install.log | tail -1

          # 接受 license（输出进日志，避免刷屏）
          yes | "$SDKMANAGER" --licenses 2>&1 | tee -a /tmp/sdk-install.log | tail -2 || true

          echo "== installing platform-tools / platform-34 / build-tools-34.0.0"
          if ! "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tee -a /tmp/sdk-install.log | tail -5; then
            echo "[error] sdkmanager base install failed"
            exit 1
          fi
          echo "== base packages installed OK"

          # NDK：runner 镜像通常已自带（如 /usr/local/lib/android/sdk/ndk/<ver>）。
          # 已有就直接复用，避免因某个具体 build 号在远端不存在而导致安装失败。
          NDK_VER=$(ls "$ANDROID_SDK_ROOT/ndk" 2>/dev/null | sort -V | tail -1)
          if [ -n "$NDK_VER" ]; then
            echo "== reusing preinstalled NDK: $NDK_VER"
          else
            echo "== no preinstalled NDK; resolving from remote list"
            NDK_PKG=$("$SDKMANAGER" --list 2>/dev/null | grep -oE 'ndk;[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1)
            echo "== installing NDK package: $NDK_PKG"
            "$SDKMANAGER" "$NDK_PKG" >>/tmp/sdk-install.log 2>&1 \
              || { echo "[error] NDK install failed"; tail -40 /tmp/sdk-install.log; exit 1; }
            NDK_VER=$(ls "$ANDROID_SDK_ROOT/ndk" 2>/dev/null | sort -V | tail -1)
          fi
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/$NDK_VER" >> "$GITHUB_ENV"
          echo "== resolved ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/$NDK_VER"
          ls "$ANDROID_SDK_ROOT/ndk/$NDK_VER" 2>/dev/null | head

      - name: Install host build deps
        id: hostdeps
        run: |
          echo "host-deps" > /tmp/ci-stage
          set -x
          sudo apt-get update 2>&1 | tee -a /tmp/host-deps.log
          sudo apt-get install -y git python3 ninja cmake make zip file 2>&1 | tee -a /tmp/host-deps.log

      - name: Resolve latest Node 24.x tag
        id: nodever
        run: |
          echo "resolve-node-tag" > /tmp/ci-stage
          TAG=$(git ls-remote --tags https://github.com/nodejs/node 2>/dev/null \
            | grep -oE 'refs/tags/v24\.[0-9]+\.[0-9]+$' \
            | sed 's#refs/tags/v##' | sort -V | tail -1)
          if [ -z "$TAG" ]; then
            echo "[warn] could not resolve latest v24.x tag via ls-remote; falling back to 24.21.0"
            TAG="24.21.0"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved Node 24.x -> $TAG"

      - name: Sync node-versions.json default/bundled to resolved tag
        id: syncjson
        env:
          NODE_TAG: ${{ steps.nodever.outputs.tag }}
        run: |
          echo "6/9 sync-json" > /tmp/ci-stage
          python3 - <<'PY'
          import json, os
          p = "app/src/main/assets/node-versions.json"
          tag = os.environ["NODE_TAG"]
          d = json.load(open(p))
          d["default"] = tag
          for v in d["versions"]:
              if v.get("bundled"):
                  v["version"] = tag
                  v["url"] = v["url"].replace("24.21.0", tag)
          json.dump(d, open(p, "w"), indent=2, ensure_ascii=False)
          print("node-versions.json default ->", tag)
          PY

      - name: Build Node for Android (NDK 交叉编译 arm64-v8a)
        id: nodebuild
        env:
          ANDROID_NDK: ${{ env.ANDROID_NDK }}
          ANDROID_API: "24"
        run: |
          echo "7/9 NODE-BUILD (longest, V8 compile)" > /tmp/ci-stage
          set -o pipefail
          chmod +x scripts/build-node-android.sh
          ./scripts/build-node-android.sh ${{ steps.nodever.outputs.tag }} 2>&1 | tee /tmp/node-build.log

      - name: Build debug APK
        id: gradlebuild
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          echo "8/9 gradle-apk" > /tmp/ci-stage
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee /tmp/gradle-build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-node-container-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ---------------------------------------------------------------------------
      # 成功自报：把构建成功标记推到 ci-ok 分支（raw 通道可读）。
      # 用自带 GITHUB_TOKEN + permissions:contents=write，不依赖 PAT Secret。
      # ---------------------------------------------------------------------------
      - name: Mark success -> ci-ok branch
        if: success()
        env:
          PAT: ${{ secrets.PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory '*'
          TOKEN_USE="${PAT:-$GH_TOKEN}"
          rm -rf /tmp/okpush && mkdir -p /tmp/okpush && cd /tmp/okpush
          git clone "https://x-access-token:${TOKEN_USE}@github.com/${{ github.repository }}.git" .
          {
            echo "BUILD_OK"
            echo "time : $(date -u)"
            echo "node : ${{ steps.nodever.outputs.tag }}"
            echo "apk  : app/build/outputs/apk/debug/app-debug.apk"
          } > ci-ok.txt
          git config user.email "ci@workbuddy.local"
          git config user.name "CI Diagnostic Bot"
          git add ci-ok.txt
          git commit -m "ci: build succeeded"
          git push origin HEAD:ci-ok --force

      # ---------------------------------------------------------------------------
      # 收尾自报：无论成功、失败、超时还是被取消，都在最后推一次 ci-last 分支，
      # 写清「最终阶段 + 结论」。这是心跳之外的第二重保障。
      #
      # 为什么用 always()：原先只有「成功->ci-ok」和「失败->ci-diag」两条路径，
      # 而 GitHub 对 job 超时/取消的情况**不会**把 job 标成 failure，于是 if: failure()
      # 不触发，ci-diag 也不更新 —— 外部看起来就是「ping 之后永远静止」，
      # 分不清「还在编」和「已经死了」。always() 保证任何结局都有留痕。
      # ---------------------------------------------------------------------------
      - name: Final report -> ci-last branch (always runs)
        if: always()
        env:
          PAT: ${{ secrets.PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory '*'
          # 停掉心跳，避免它在收尾后继续推分支造成混淆
          rm -f /tmp/ci-keepalive
          TOKEN_USE="${PAT:-$GH_TOKEN}"
          mkdir -p /tmp/lastpush
          {
            echo "CI_LAST_REPORT"
            echo "time   : $(date -u)"
            echo "run    : ${{ github.run_id }}"
            echo "sha    : ${{ github.sha }}"
            echo "stage  : $(cat /tmp/ci-stage 2>/dev/null || echo unknown)"
            echo "job    : ${{ job.status }}"
            echo
            echo "=== step outcomes ==="
            echo "ping        : ${{ steps.ping.outcome }}"
            echo "checkout    : ${{ steps.checkout.outcome }}"
            echo "setup-java  : ${{ steps.setupjava.outcome }}"
            echo "sdk-env     : ${{ steps.sdkenv.outcome }}"
            echo "sdk-install : ${{ steps.sdkinstall.outcome }}"
            echo "host-deps   : ${{ steps.hostdeps.outcome }}"
            echo "node-tag    : ${{ steps.nodever.outcome }}"
            echo "sync-json   : ${{ steps.syncjson.outcome }}"
            echo "node-build  : ${{ steps.nodebuild.outcome }}"
            echo "gradle-build: ${{ steps.gradlebuild.outcome }}"
            echo
            echo "=== node-build.log size / tail ==="
            wc -c /tmp/node-build.log 2>/dev/null || echo "(no node-build.log)"
            tail -30 /tmp/node-build.log 2>/dev/null | cut -c1-400
          } > /tmp/ci-last-report.txt
          cd /tmp/lastpush
          git clone --quiet "https://x-access-token:${TOKEN_USE}@github.com/${{ github.repository }}.git" . 2>/dev/null || true
          [ -d .git ] || { echo "[warn] clone failed, skip ci-last"; exit 0; }
          git config user.email "ci@workbuddy.local"
          git config user.name "CI Final Report"
          cp /tmp/ci-last-report.txt ci-last.txt
          git add -f ci-last.txt
          git commit -q -m "ci: final report" || true
          git push origin HEAD:ci-last --force && echo "[ok] ci-last pushed"

      # ---------------------------------------------------------------------------
      # 失败自诊：沙箱侧无法直接访问 GitHub API/日志，故把报错汇总推到 ci-diag 分支，
      # 通过 raw.githubusercontent.com（git/raw 流量可穿透 ghproxy）让维护者能读取。
      # 仅在该 job 任一步骤失败时运行。
      # ---------------------------------------------------------------------------
      - name: Capture failure diagnostics (write file + push branch)
        if: failure()
        env:
          PAT: ${{ secrets.PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory '*'
          TOKEN_USE="${PAT:-$GH_TOKEN}"
          mkdir -p diag
          {
            echo "=== CI failure diagnostics ==="
            echo "run : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "node: ${{ steps.nodever.outputs.tag }}"
            echo "ANDROID_SDK_ROOT: ${ANDROID_SDK_ROOT:-<unset>}"
            echo "ANDROID_NDK: ${ANDROID_NDK:-<unset>}"
            echo
            echo "=== step outcomes (success/failure/skipped) ==="
            echo "ping        : ${{ steps.ping.outcome }}"
            echo "checkout    : ${{ steps.checkout.outcome }}"
            echo "setup-java  : ${{ steps.setupjava.outcome }}"
            echo "sdk-env     : ${{ steps.sdkenv.outcome }}"
            echo "sdk-install : ${{ steps.sdkinstall.outcome }}"
            echo "host-deps   : ${{ steps.hostdeps.outcome }}"
            echo "node-tag    : ${{ steps.nodever.outcome }}"
            echo "sync-json   : ${{ steps.syncjson.outcome }}"
            echo "node-build  : ${{ steps.nodebuild.outcome }}"
            echo "gradle-build: ${{ steps.gradlebuild.outcome }}"
            echo
            echo "=== sdk-install.log (filtered tail 60, license noise removed) ==="
            grep -viE "warranty|liability|indemnif|export regulation|severability|pre-release|evaluation license|open source software|MIPS|Accept\? \(y/N\)|YOUR USE OF|Google is the parent|third party beneficiaries|EXPORT RESTRICTIONS|governing law|Santa Clara|conflict of laws" /tmp/sdk-install.log 2>/dev/null | tail -60 \
              || echo "(no sdk-install.log)"
            echo
            echo "=== node-build.log :: ALL error lines (grep -n) ==="
            grep -anE "error:|Error [0-9]+|undefined (reference|symbol)|fatal error|ld\.lld: error|collect2: error" /tmp/node-build.log 2>/dev/null | tail -60 \
              || echo "(no matching error lines in node-build.log)"
            echo
            echo "=== node-build.log :: context around FIRST error (40 lines before/after) ==="
            FIRST_ERR=$(grep -anE "error:|fatal error" /tmp/node-build.log 2>/dev/null | head -1 | cut -d: -f1)
            if [ -n "$FIRST_ERR" ]; then
              START=$(( FIRST_ERR > 40 ? FIRST_ERR - 40 : 1 ))
              END=$(( FIRST_ERR + 40 ))
              echo "--- first error at line $FIRST_ERR, showing $START..$END ---"
              sed -n "${START},${END}p" /tmp/node-build.log | cut -c1-500
            else
              echo "(no 'error:' line found; see tail below)"
            fi
            echo
            echo "=== node-build.log :: context around LAST error (40 lines before/after) ==="
            LAST_ERR=$(grep -anE "error:|fatal error" /tmp/node-build.log 2>/dev/null | tail -1 | cut -d: -f1)
            if [ -n "$LAST_ERR" ]; then
              START=$(( LAST_ERR > 40 ? LAST_ERR - 40 : 1 ))
              END=$(( LAST_ERR + 40 ))
              echo "--- last error at line $LAST_ERR, showing $START..$END ---"
              sed -n "${START},${END}p" /tmp/node-build.log | cut -c1-500
            else
              echo "(no 'error:' line found; see tail below)"
            fi
            echo
            echo "=== node-build.log (tail 200, warnings filtered out) ==="
            grep -avE "warning:|note:| \^|^\s*\||^\s*[0-9]+ \|" /tmp/node-build.log 2>/dev/null | tail -200 \
              || echo "(no node-build.log — failure occurred before Node build)"
            echo
            echo "=== gradle-build.log (tail 150) ==="
            tail -150 /tmp/gradle-build.log 2>/dev/null || echo "(no gradle-build.log — failure before Gradle)"
          } > diag/ci-failure-last.txt
          echo "----- diag size -----"; wc -c diag/ci-failure-last.txt

          # 推 ci-diag 分支（该通道已由 ci-ping 验证可用）。
          # 用 clone 出来的独立目录，并显式 mkdir/copy/add/commit，避免被静默吞错。
          rm -rf /tmp/diagpush && mkdir -p /tmp/diagpush && cd /tmp/diagpush
          git clone "https://x-access-token:${TOKEN_USE}@github.com/${{ github.repository }}.git" .
          mkdir -p diag
          cp "$GITHUB_WORKSPACE/diag/ci-failure-last.txt" diag/ci-failure-last.txt
          echo "[check] diag dir now contains:"; ls -la diag/
          git config user.email "ci@workbuddy.local"
          git config user.name "CI Diagnostic Bot"
          git add -f diag/ci-failure-last.txt
          echo "[check] staged files:"; git status --short
          git commit -m "ci: automated failure diagnostics"
          echo "[check] commit created:"; git log --oneline -1
          git push origin HEAD:ci-diag --force
          echo "--- diagnostics pushed: $(git rev-parse HEAD) ---"
      - name: Upload failure diagnostics artifact (backup)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diag-log
          path: diag/ci-failure-last.txt
          if-no-files-found: warn
