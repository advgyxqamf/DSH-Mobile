name: Admin (cancel / status)

# ============================================================================
#  为什么要这个 workflow
# ============================================================================
#  维护环境（沙箱）没有可用的 GitHub API token（PAT 已失效、gh CLI 401），
#  唯一的通道是 git push。但有些事【只能通过 API 做】，最典型的是：
#      · 取消一个正在跑的 run（不能在沙箱侧 gh run cancel）
#      · 查某个 run 的状态与 artifact
#
#  GitHub 提供 GITHUB_TOKEN（每个 run 自动注入、权限受 permissions 控制），
#  所以只要能让一个 workflow 跑起来，它就能替我们做这些 API 操作。
#  触发手段就是 tag —— 一条 git push 即可，不需要网页，也不需要 PAT。
#
#  tag 语法（命令 → 动作）
#    admin-cancel-<run_id>    取消指定 run
#    admin-status-<run_id>    查询指定 run 状态 + artifact 列表
#    admin-cancelall          取消所有 queued/in_progress 的 run（除自己）
#
#  例：git push origin HEAD:refs/tags/admin-cancel-34880060734
#      结果会写进 ci-admin 分支，沙箱侧 fetch 该分支即可读到。
# ============================================================================

on:
  push:
    tags:
      - 'admin-*'

permissions:
  actions: write
  contents: write

jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse action from tag
        id: act
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME:-}"
          echo "tag=$TAG"
          CMD="${TAG#admin-}"
          echo "cmd=$CMD"
          echo "cmd=$CMD" >> "$GITHUB_OUTPUT"
          case "$CMD" in
            cancelall)  echo "kind=cancelall" >> "$GITHUB_OUTPUT" ;;
            cancel-*)   echo "kind=cancel"; echo "target=${CMD#cancel-}" >> "$GITHUB_OUTPUT" ;;
            status-*)   echo "kind=status"; echo "target=${CMD#status-}" >> "$GITHUB_OUTPUT" ;;
            *)          echo "[error] 未知动作: $CMD"; exit 1 ;;
          esac

      - name: Execute
        id: exec
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          KIND: ${{ steps.act.outputs.kind }}
          TARGET: ${{ steps.act.outputs.target }}
          SELF_RUN: ${{ github.run_id }}
        run: |
          set -uo pipefail
          OUT=/tmp/admin.txt
          {
            echo "ADMIN_REPORT"
            echo "time  : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "tag   : ${GITHUB_REF_NAME}"
            echo "kind  : $KIND"
            echo "target: ${TARGET:-(n/a)}"
            echo
          } > "$OUT"

          case "$KIND" in
            cancel)
              echo "== 取消 run $TARGET ==" >> "$OUT"
              if gh run cancel "$TARGET" --repo "$REPO" >> "$OUT" 2>&1; then
                echo "结果: 取消请求已发送" >> "$OUT"
              else
                echo "结果: 取消失败（可能已结束或 ID 不存在）" >> "$OUT"
              fi
              sleep 15
              echo >> "$OUT"
              echo "=== 取消后状态 ===" >> "$OUT"
              gh run view "$TARGET" --repo "$REPO" --json status,conclusion \
                --jq '"  status=\(.status)  conclusion=\(.conclusion)"' >> "$OUT" 2>&1 || true
              ;;

            cancelall)
              echo "== 取消所有非本 run 的 queued/in_progress ==" >> "$OUT"
              # 注意：不能连自己一起取消，否则后面的 push 上报会被中断。
              for st in queued in_progress; do
                gh run list --repo "$REPO" --status "$st" --limit 50 \
                  --json databaseId,workflowName,headSha \
                  --jq '.[] | "\(.databaseId)\t\(.workflowName)\t\(.headSha[0:7])"' \
                | while IFS=$'\t' read -r rid wf sha; do
                    [ -z "$rid" ] && continue
                    if [ "$rid" = "$SELF_RUN" ]; then
                      echo "  [skip] $rid  $wf  $sha  (本 run)" >> "$OUT"
                      continue
                    fi
                    echo "  [cancel] $rid  $wf  $sha" >> "$OUT"
                    gh run cancel "$rid" --repo "$REPO" >>"$OUT" 2>&1 || true
                  done
              done
              sleep 15
              echo >> "$OUT"
              echo "=== 剩余在跑 ===" >> "$OUT"
              gh run list --repo "$REPO" --status in_progress --limit 20 \
                --json databaseId,workflowName \
                --jq '.[] | "  \(.databaseId)  \(.workflowName)"' >> "$OUT" 2>&1 || true
              ;;

            status)
              echo "== run $TARGET 详情 ==" >> "$OUT"
              gh run view "$TARGET" --repo "$REPO" \
                --json databaseId,workflowName,headSha,status,conclusion,createdAt,updatedAt,url \
                --jq '"  wf    : \(.workflowName)\n  sha   : \(.headSha[0:7])\n  status: \(.status)\n  concl : \(.conclusion)\n  start : \(.createdAt)\n  end   : \(.updatedAt)\n  url   : \(.url)"' >> "$OUT" 2>&1 || true

              echo >> "$OUT"
              echo "=== artifact 列表 ===" >> "$OUT"
              gh api "repos/$REPO/actions/runs/$TARGET/artifacts" \
                --jq '.artifacts[] | "  id=\(.id)  \(.name)  \(.size_in_bytes)B  expired=\(.expired)  digest=\(.digest // "n/a")"' >> "$OUT" 2>&1 || true
              ;;

            *)
              echo "[error] 未处理的 kind=$KIND" >> "$OUT"
              ;;
          esac

          echo >> "$OUT"
          echo "=== 最近 8 个 run ===" >> "$OUT"
          gh run list --repo "$REPO" --limit 8 \
            --json databaseId,workflowName,headSha,status,conclusion,createdAt \
            --jq '.[] | "  \(.databaseId)  \(.headSha[0:7])  \(.status)/\(.conclusion)  \(.workflowName)"' >> "$OUT" 2>&1 || true

          cat "$OUT"

      - name: Report to ci-admin
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          git config user.name  'CI Admin' || true
          git config user.email 'ci@workbuddy.local' || true
          git checkout --orphan ci-admin-tmp 2>/dev/null || git checkout ci-admin-tmp
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/admin.txt ci-admin.txt
          git add -f ci-admin.txt
          git commit -m "admin report: ${GITHUB_REF_NAME}" || true
          git push -f origin HEAD:ci-admin
